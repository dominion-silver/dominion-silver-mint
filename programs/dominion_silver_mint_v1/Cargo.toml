[package]
name = "dominion_silver_mint"
version = "0.1.0"
description = "Dominion Silver mint/redeem on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "dominion_silver_mint_v1_frozen"
# RENOMME 2026-08-07, round 4. V1 et V2 declaraient TOUTES DEUX `[lib] name = "dominion_silver_mint"`.
# `solana-verify --library-name dominion_silver_mint` resout par `find <mount> -name Cargo.toml` et prend le
# PREMIER match, sans avertir de l ambiguite. Sur macOS `find` renvoie V1 en premier; en CI c est tombe sur
# V2. Quel contrat se fait attester relevait donc de l ordre de lecture du repertoire.
#
# V1 est exclue du workspace et a son propre Cargo.lock, donc un build V1 n heriterait NI de lto = "fat", NI
# de codegen-units = 1, NI de overflow-checks = true, et il ecrirait quand meme dans
# target/deploy/dominion_silver_mint.so, exactement le chemin que l etape de comparaison hache.

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1", features = ["token", "token_2022", "associated_token"] }
pyth-solana-receiver-sdk = "0.6.0"
spl-token-2022 = { version = "7.0", features = ["no-entrypoint"] }
spl-token-metadata-interface = "0.6"

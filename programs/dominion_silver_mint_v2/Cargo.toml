[package]
name = "dominion_silver_mint"
version = "0.1.0"
description = "Dominion Silver mint/redeem on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "dominion_silver_mint"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
# CODEX P0-02: dev-only timelock-bypass hatches (dev_set_max_staleness /
# dev_set_premiums) are compiled ONLY under this feature. It is NOT in
# `default`, so the standard `cargo-build-sbf` (release/deploy) build and the
# generated IDL do NOT contain them. Devnet testing builds with
# `--features dev-hatch`. Release/mainnet/CI builds MUST NOT pass it.
dev-hatch = []
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1", features = ["token", "token_2022", "associated_token"] }
pyth-solana-receiver-sdk = "0.6.0"
spl-token-2022 = { version = "7.0", features = ["no-entrypoint"] }
spl-token-metadata-interface = "0.6"
# CI EDITION2024-FORBID PINS (not used in code; pulled transitively).
# Root cause (evidence: CI runs 26086567305 + 26087219838): Anchor's SBF
# build AND its IDL-extraction sub-build both run under the Solana
# platform-tools cargo, which is 1.84 for EVERY Anchor-0.31.1-compatible
# Solana release (3.0.0 / 3.1.13 / 3.1.14 all link SBF rust 1.84.1).
# cargo 1.84 cannot even PARSE a manifest that declares `edition2024`.
# The build must stay UNLOCKED: a fully locked graph hits
# pyth-solana-receiver-sdk E0782 under the 1.84 SBF rustc, and the
# unlocked re-resolve is what floats that dep to a dyn-fixed version.
# But the same unlocked re-resolve also floats these transitively-pulled
# crates to their newest line, which flipped to `edition2024`:
#   constant_time_eq 0.4.x  (blake3 -> solana-blake3-hasher -> ...)
#   cpufeatures      0.3.0  (sha2/curve25519 -> solana-program -> ...)
#   toml_datetime    1.1.x  (toml, anchor-cli IDL-extraction graph)
# An explicit `=` constraint forbids the edition2024 line workspace-wide
# on ANY re-resolve while leaving every other dep free to float (so the
# E0782-fixing re-resolve still happens). Each pinned version is exactly
# the one already in the committed Cargo.lock, so this does not change
# resolution: it only forbids the newer unparseable line. Remove each
# pin when the platform-tools cargo Anchor uses for SBF + IDL natively
# supports edition2024 (cargo >= 1.85).
constant_time_eq = "=0.3.1"
cpufeatures = "=0.2.17"
toml_datetime = "=0.6.11"

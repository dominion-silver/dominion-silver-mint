[workspace]
members = ["programs/*"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# Force a single anchor-lang / anchor-spl version tree.
# Without this, pyth-solana-receiver-sdk 0.6.x pulls anchor-lang 1.0.x
# (because its dep constraint is `>=0.28.0`), which drags in solana-pubkey
# 4.2.0 requiring Rust 1.89+ and breaks edition2021 consumers.
# Kamino + MarginFi use the same pattern (patch.crates-io pins).
[patch.crates-io]
anchor-lang = { git = "https://github.com/coral-xyz/anchor", tag = "v0.31.1" }
anchor-spl = { git = "https://github.com/coral-xyz/anchor", tag = "v0.31.1" }

# V2 is the active build/deploy crate. V1 is a frozen reference copy of the
# pre-Option-B contract (commit adeb894) kept for codex diff/review; it is
# excluded so the `programs/*` set does not yield two crates with the same
# package name. V1 stays fully readable and diffable.
[workspace]
members = ["programs/dominion_silver_mint_v2"]
exclude = ["programs/dominion_silver_mint_v1"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# Force a single anchor-lang / anchor-spl version tree.
# Without this, pyth-solana-receiver-sdk 0.6.x pulls anchor-lang 1.0.x
# (because its dep constraint is `>=0.28.0`), which drags in solana-pubkey
# 4.2.0 requiring Rust 1.89+ and breaks edition2021 consumers.
# Kamino + MarginFi use the same pattern (patch.crates-io pins).
[patch.crates-io]
anchor-lang = { git = "https://github.com/coral-xyz/anchor", tag = "v0.31.1" }
anchor-spl = { git = "https://github.com/coral-xyz/anchor", tag = "v0.31.1" }
# Vendored pyth-solana-receiver-sdk 0.6.1 (EXACT version the deployed +
# codex-audited + 68/68-tested devnet program uses), with a minimal
# 3-line patch so it compiles on modern Rust: upstream's bare-trait
# `AnchorSerialize::try_to_vec` is an E0782 hard error >= rust ~1.84 and
# pyth never fixed it through HEAD; `solana-program 2.3.0` needs rust
# >= 1.79, so no single non-vendored toolchain can build this graph
# (proven over 13 CI runs; see private/CI_IDL_DETERMINISM.md "DECISION").
# Price logic is byte-identical to the audited program: ONLY the
# try_to_vec call syntax + an explicit borsh dep changed.
pyth-solana-receiver-sdk = { path = "vendor/pyth-solana-receiver-sdk" }

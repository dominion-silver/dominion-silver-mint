# V2 is the active build/deploy crate. V1 is a frozen reference copy of the
# excluded so the `programs/*` set does not yield two crates with the same
# package name. V1 stays fully readable and diffable.
[workspace]
# tools/mock-lazer is a behavioral-harness-only mock program (NOT deployed; the
# deploy build targets programs/dominion_silver_mint_v2 explicitly). It is a
# member only so it shares this workspace's SBF-parseable dep lock.
members = ["programs/dominion_silver_mint_v2", "tools/mock-lazer"]
resolver = "2"

# solana-verify choisit son image Docker en lisant CETTE cle EN PREMIER
# (solana-verify 0.5.1, main.rs:954-959), et ne retombe sur la version de `solana-program` du
# Cargo.lock qu a defaut. C est ce fallback qui avait selectionne l image 2.3.0 au premier essai,
# alors que la chaine de release est 3.0.0. La declarer ici rend le choix explicite et rend
# --base-image inutile.
[workspace.metadata.cli]
solana = "3.0.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# Pin anchor-lang / anchor-spl to the exact git tag for a single, reproducible
# version tree (the deterministic IDL build depends on this; see
# Proven over repeated CI runs). Kamino +
# MarginFi use the same patch.crates-io pin pattern.
# (The vendored pyth-solana-receiver-sdk patch was removed 2026-06-10 with the
# Pyth Lazer migration; the Core receiver SDK is no longer a dependency.)
[patch.crates-io]
anchor-lang = { git = "https://github.com/coral-xyz/anchor", tag = "v0.31.1" }
anchor-spl = { git = "https://github.com/coral-xyz/anchor", tag = "v0.31.1" }

name: RedeemEvent monitor

# Watches the redemption outflow: is it abnormal, and can the treasury still serve it.
# It runs on a schedule here rather than on a workstation so the alarm survives a closed lid.
# WHAT IT COSTS IN PRIVACY, since this repository is PUBLIC: the run log shows redemption amounts and
# the redeemer's address. All of it is already on chain and readable by anyone, so this publishes
# nothing that was private. What must NOT reach the log is the RPC credential, and it does not: the
# script prints the endpoint through `redactRpc`, which strips the query string and the path.
# A RED RUN MEANS THIS CHECK IS BROKEN, not that the protocol is. Alerts go to Telegram, and only when
# something changes. The job's own status is reserved for "the check could not be completed".
# GRANULARITY, honestly. The scheduler's minimum is 5 minutes and runs are queued, so the real spacing
# is 10 to 20 minutes. What bounds a drain is the protocol's own rolling budget, not the speed of this
# alarm, and pausing carries multisig latency regardless. This exists to put a human in the loop.

on:
  schedule:
    # Every 10 minutes. Cheap: one config read plus one signature page per run.
    - cron: "*/10 * * * *"
  # So it can be fired by hand during the ceremony and on launch day, without waiting for the tick.
  workflow_dispatch:
    inputs:
      cluster:
        description: "Which cluster to check"
        required: true
        default: mainnet
        type: choice
        options: [mainnet, devnet]

permissions:
  contents: read

concurrency:
  # Never let a slow run overlap the next tick: two monitors reporting the same window is noise, and the
  # in-flight one has the better view. `cancel-in-progress: false` so the running check finishes.
  group: redeem-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts

      # The alert memory. A miss costs one duplicate message; see health-monitor.yml for the reasoning.
      # A DIFFERENT KEY from the health monitor's on purpose: sharing one would let either monitor
      # "resolve" the other's open conditions, which is a silence bug and the worst kind.
      - name: Restore alert state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .monitor-state
          key: redeem-alert-state-${{ github.run_id }}
          restore-keys: redeem-alert-state-

      - name: Check the redemption budget and the RedeemEvent stream
        env:
          # REQUIRED SECRETS, and the run FAILS LOUDLY without them rather than silently checking devnet:
          #   RPC_MAINNET  full endpoint URL including the provider key
          #   RPC_DEVNET   same, devnet
          # Set them under Settings > Secrets and variables > Actions. A public repository still keeps
          # Actions secrets private; they are simply unavailable to pull requests from forks, and this
          # workflow never runs on a fork PR.
          RPC_MAINNET: ${{ secrets.RPC_MAINNET }}
          RPC_DEVNET: ${{ secrets.RPC_DEVNET }}
          # The channel the alerts actually reach. Without these the script says so and exits 1, which
          # is the correct reading: an undelivered alert is a broken monitor.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
          WANT: ${{ inputs.cluster || 'mainnet' }}
          REDEEM_ALERT_SINGLE_PCT: "25"
          REDEEM_ALERT_BUDGET_PCT: "60"
          # Higher than the script's default of 25, which exists to survive the free devnet endpoint.
          # This runs on a paid one.
          REDEEM_SCAN_LIMIT: "200"
        run: |
          set -euo pipefail
          if [ "${WANT}" = "devnet" ]; then RPC="${RPC_DEVNET:-}"; else RPC="${RPC_MAINNET:-}"; fi
          if [ -z "${RPC}" ]; then
            echo "::error::the ${WANT} RPC secret is not set, so this check did not run."
            echo "::error::Set RPC_MAINNET (and RPC_DEVNET) in the repository's Actions secrets."
            # A monitor that cannot check must not report success. This is now the ONLY meaning of a
            # red run here: could-not-tell is not silence.
            exit 1
          fi
          # NEVER echo $RPC. It carries the provider key.
          echo "checking ${WANT}"
          DOMINION_RPC="${RPC}" npx tsx scripts/redeem-monitor.ts

      - name: Save alert state
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .monitor-state
          key: redeem-alert-state-${{ github.run_id }}

name: Anchor Build + Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # EVIDENCE-DRIVEN (2026-05-19): 3.1.13 was the bug. The prior comment
  # *assumed* "3.1.13 = rustc 1.89" but CI runs proved its platform-tools
  # rustc behaves ~1.84 (edition2024-unparseable + pyth-solana-receiver-sdk
  # E0782 when locked). The LOCAL toolchain that actually built the live V2
  # .so + IDL is Solana 3.1.14 -> platform-tools v1.52 -> rustc 1.89.0
  # (edition2024-capable, compiles modern pyth-sdk). Pinning CI to 3.1.14 =
  # one consistent modern toolchain for BOTH the SBF build and the host IDL
  # build. Contract source / Anchor / pyth unchanged -> deployed bytes +
  # IDL unaffected (no redeploy). See private/CI_IDL_DETERMINISM.md.
  SOLANA_VERSION: 3.1.14
  ANCHOR_VERSION: 0.31.1
  RUST_VERSION: 1.89.0
  NODE_VERSION: 20

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Solana CLI (Agave v${{ env.SOLANA_VERSION }})
        run: |
          # Pin to the exact version rather than "stable" (which has returned
          # corrupted tarballs on anza.xyz CDN at least once; retry loop makes
          # the install resilient to transient network errors).
          for attempt in 1 2 3; do
            if sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"; then
              break
            fi
            echo "Solana install attempt $attempt failed, retrying..."
            sleep 10
          done
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          $HOME/.local/share/solana/install/active_release/bin/solana --version
          $HOME/.local/share/solana/install/active_release/bin/cargo-build-sbf --version

      - name: Install Anchor CLI (git+tag+locked pattern)
        run: |
          # --force in case cache restored a stale binary from a previous run.
          cargo install --git https://github.com/coral-xyz/anchor --tag "v${ANCHOR_VERSION}" anchor-cli --locked --force
          anchor --version

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --force
        continue-on-error: true

      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: cargo fmt check
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: cargo audit (CVE check)
        run: cargo audit
        continue-on-error: true

      - name: anchor build (full, platform-tools v1.52 = local toolchain)
        # OPTION B SPIKE (evidence converged over CI runs 26086567305 /
        # 26087219838 / 26088175606 / 26089090936 + local ground truth).
        #
        # The genuine bind on the SBF target under the platform-tools
        # cargo 1.84 (= platform-tools v1.51, what CI kept getting):
        #   - locked graph  -> pyth-solana-receiver-sdk E0782 (12 errs),
        #     the SBF rustc 1.84 cannot compile the locked pyth.
        #   - unlocked graph -> floats cpufeatures to 0.3.0 which is
        #     edition2024 (cargo 1.84 cannot even PARSE it); the older
        #     cpufeatures 0.2.x instead `compile_error!`s on sbpf.
        # No flag escapes this under cargo 1.84.
        #
        # Local FACT (verified: ~/.cache/solana/v1.52/.../rustc =
        # 1.89.0): the deployed + sha256-verified V2 .so + IDL were built
        # with platform-tools **v1.52 = cargo/rustc 1.89.0**. Under 1.89
        # the unlocked re-resolve is fine: pyth floats to a dyn-fixed
        # version (no E0782) AND cpufeatures 0.3.0 both parses (1.89
        # supports edition2024) and supports sbpf. Both failure modes
        # vanish together. agave 3.1.14's cargo-build-sbf DEFAULT is
        # already v1.52 (`--version` prints it; run 26089090936 proved
        # `--tools-version v1.52 --force-tools-install` installs
        # `1.89.0-sbpf-solana-v1.52`); CI only got v1.51 because the
        # agave installer pre-seeds v1.51 and cargo-build-sbf reuses it.
        #
        # The ONLY remaining bug in run 26089090936 was SPLITTING the
        # build: `anchor build --no-idl` (v1.52) then a SEPARATE
        # `anchor idl build` re-ran cargo-build-sbf setup WITHOUT the
        # flag and reverted v1.52 -> v1.51 before the IDL compile. Fix:
        # ONE full `anchor build` (SBF + its internal IDL sub-build in a
        # single cargo-build-sbf toolchain context, exactly how the local
        # machine builds), forced onto v1.52. Unlocked (full anchor build
        # does not pass --locked). This replicates the local toolchain
        # 1:1: contract source / Anchor / pyth unchanged, deployed bytes
        # + IDL unaffected (no redeploy). See private/CI_IDL_DETERMINISM.md.
        #
        # Blocking gate (no continue-on-error). rustup default
        # ${RUST_VERSION} keeps the host cargo at 1.89; loud guard if the
        # host cargo is < 1.85.
        run: |
          rustup default ${RUST_VERSION}
          echo "host cargo  : $(cargo --version)"
          echo "sbf default : $(cargo-build-sbf --version | tr '\n' ' ')"
          ver="$(cargo --version | awk '{print $2}')"
          major="${ver%%.*}"; rest="${ver#*.}"; minor="${rest%%.*}"
          if [ "$major" -lt 1 ] || { [ "$major" -eq 1 ] && [ "$minor" -lt 85 ]; }; then
            echo "::error::host cargo $ver lacks edition2024 (need >= 1.85)"
            exit 1
          fi
          # ONE full build (SBF + internal IDL sub-build), UNLOCKED,
          # forced onto platform-tools v1.52 (cargo 1.89) = the exact
          # local toolchain. --force-tools-install so the agave-installer
          # pre-seeded v1.51 cannot shadow v1.52. NOT split: a second
          # anchor invocation reverts the toolchain (run 26089090936).
          anchor build -- --tools-version v1.52 --force-tools-install
          # Verify-before-claim: prove which SBF toolchain actually ran
          # (must be the 1.89.0 / v1.52 one, not 1.84.1 / v1.51).
          echo "sbf toolchains linked:"
          rustup toolchain list | grep -i sbpf || echo "  (none listed)"
          if [ ! -s target/idl/dominion_silver_mint.json ]; then
            echo "::error::IDL not produced or empty"
            exit 1
          fi
          echo "IDL bytes: $(wc -c < target/idl/dominion_silver_mint.json)"

      - name: Yarn install (post-build, for tests only)
        run: yarn install
        continue-on-error: true

      - name: Upload IDL artifact
        uses: actions/upload-artifact@v4
        with:
          name: idl
          path: target/idl/

      - name: Upload program binary
        uses: actions/upload-artifact@v4
        with:
          name: program-binary
          path: target/deploy/*.so

      - name: Upload Cargo.lock (for commit if not present)
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: Cargo.lock

      - name: anchor test
        run: anchor test --skip-local-validator
        continue-on-error: true # tests are placeholders; will fail until 55-test matrix implemented

  reproducible-build:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install solana-verify
        run: cargo install solana-verify --locked
        continue-on-error: true

      - name: Verifiable build
        run: |
          solana-verify build
        continue-on-error: true # until Docker image + Cargo.lock stable

      - name: Report binary hash
        run: |
          if [ -f target/deploy/dominion_silver_mint.so ]; then
            sha256sum target/deploy/dominion_silver_mint.so
          fi

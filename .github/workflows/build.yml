name: Anchor Build + Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # EVIDENCE-DRIVEN (2026-05-19): 3.1.13 was the bug. The prior comment
  # *assumed* "3.1.13 = rustc 1.89" but CI runs proved its platform-tools
  # rustc behaves ~1.84 (edition2024-unparseable + pyth-solana-receiver-sdk
  # E0782 when locked). The LOCAL toolchain that actually built the live V2
  # .so + IDL is Solana 3.1.14 -> platform-tools v1.52 -> rustc 1.89.0
  # (edition2024-capable, compiles modern pyth-sdk). Pinning CI to 3.1.14 =
  # one consistent modern toolchain for BOTH the SBF build and the host IDL
  # build. Contract source / Anchor / pyth unchanged -> deployed bytes +
  # IDL unaffected (no redeploy). See private/CI_IDL_DETERMINISM.md.
  SOLANA_VERSION: 3.1.14
  ANCHOR_VERSION: 0.31.1
  RUST_VERSION: 1.89.0
  NODE_VERSION: 20

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Solana CLI (Agave v${{ env.SOLANA_VERSION }})
        run: |
          # Pin to the exact version rather than "stable" (which has returned
          # corrupted tarballs on anza.xyz CDN at least once; retry loop makes
          # the install resilient to transient network errors).
          for attempt in 1 2 3; do
            if sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"; then
              break
            fi
            echo "Solana install attempt $attempt failed, retrying..."
            sleep 10
          done
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          $HOME/.local/share/solana/install/active_release/bin/solana --version
          $HOME/.local/share/solana/install/active_release/bin/cargo-build-sbf --version

      - name: Pin platform-tools to v1.52 (cargo 1.89, edition2024-capable)
        # Why this is needed EVEN WITH the vendored pyth: run 26095758504
        # proved the vendored+patched pyth compiles + the SBF build
        # `Finished` under the stock platform-tools cargo 1.84, but
        # anchor's IDL-extraction sub-build then re-resolves UNLOCKED and
        # pulls `ctutils 0.4.2` (edition2024) which cargo 1.84 cannot even
        # PARSE; `--locked` via anchor's arg-forwarding does NOT reach
        # that internal re-resolution (run 26096919038). The robust fix
        # is a cargo that CAN parse edition2024: platform-tools v1.52 =
        # cargo/rustc 1.89.0. cargo-build-sbf (toolchain.rs
        # install_if_missing) REUSES ~/.cache/solana/<ver>/platform-tools
        # if it exists + is non-empty (no --force). The released v3.1.14
        # binary resolves <ver>=v1.51 (CI gets cargo 1.84) so we pre-seed
        # the v1.52 tree at BOTH the v1.51 and v1.52 cache paths => every
        # no-flag cargo-build-sbf call (SBF build AND the IDL sub-build)
        # runs rust 1.89. This only works now because the vendored pyth
        # patch removed the E0782 that broke 1.89 before. Hard guard:
        # fail loudly unless the seeded rustc is 1.89.
        run: |
          PT="https://github.com/anza-xyz/platform-tools/releases/download/v1.52/platform-tools-linux-x86_64.tar.bz2"
          for attempt in 1 2 3; do
            if curl -sSfL "$PT" -o /tmp/pt152.tar.bz2; then break; fi
            echo "platform-tools v1.52 download attempt $attempt failed, retrying..."
            sleep 10
          done
          for ver in v1.51 v1.52; do
            dst="$HOME/.cache/solana/$ver/platform-tools"
            rm -rf "$dst"
            mkdir -p "$dst"
            tar --strip-components 1 -jxf /tmp/pt152.tar.bz2 -C "$dst"
          done
          rm -f /tmp/pt152.tar.bz2
          RUSTC="$HOME/.cache/solana/v1.51/platform-tools/rust/bin/rustc"
          if [ ! -x "$RUSTC" ]; then
            echo "::error::seeded rustc missing at $RUSTC"
            ls -la "$HOME/.cache/solana/v1.51/platform-tools" || true
            exit 1
          fi
          PTV="$("$RUSTC" --version)"
          echo "seeded sbf rustc: $PTV"
          case "$PTV" in
            *"1.89."*) echo "OK: platform-tools pinned to rust 1.89 (v1.52)";;
            *) echo "::error::seeded rustc is not 1.89: $PTV"; exit 1;;
          esac

      - name: Install Anchor CLI (git+tag+locked pattern)
        run: |
          # --force in case cache restored a stale binary from a previous run.
          cargo install --git https://github.com/coral-xyz/anchor --tag "v${ANCHOR_VERSION}" anchor-cli --locked --force
          anchor --version

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --force
        continue-on-error: true

      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: cargo fmt check
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: cargo audit (CVE check)
        run: cargo audit
        continue-on-error: true

      - name: anchor build (plain; vendored pyth + pre-seeded cargo 1.89)
        # CONVERGED FIX = union of two independently-proven facts:
        #  1. The vendored + minimally-patched pyth-solana-receiver-sdk
        #     0.6.1 (commit 39a62e7, triple-reviewed SHIP, serialization
        #     byte-equivalent) removed the E0782 root cause - run
        #     26095758504 proved the SBF build `Finished release` + the
        #     IDL compile `Finished test` both succeed.
        #  2. The "Pin platform-tools v1.52" step above makes every
        #     cargo-build-sbf invocation (the SBF build AND anchor's
        #     internal IDL sub-build) run cargo 1.89.
        # Run 26096919038 proved anchor's IDL extraction re-resolves
        # UNLOCKED regardless of `--locked` forwarding (it pulled
        # `ctutils 0.4.2`, edition2024). Under cargo 1.84 that is a parse
        # error; under the pre-seeded cargo 1.89 it parses fine. So a
        # PLAIN full `anchor build` works: pyth is the vendored patched
        # path-dep (deterministic via [patch.crates-io] regardless of
        # re-resolution), and the unlocked re-resolve's edition2024
        # crates are parseable at 1.89. No split / no --locked (anchor
        # forwarding does not deliver it to the internal resolve anyway).
        # Blocking gate (no continue-on-error). Contract behaviour
        # byte-identical. private/CI_IDL_DETERMINISM.md.
        run: |
          rustup default ${RUST_VERSION}
          echo "host cargo  : $(cargo --version)"
          echo "seeded sbf  : $($HOME/.cache/solana/v1.51/platform-tools/rust/bin/rustc --version)"
          anchor build
          echo "sbf toolchains linked:"
          rustup toolchain list | grep -i sbpf || echo "  (none listed)"
          if [ ! -s target/idl/dominion_silver_mint.json ]; then
            echo "::error::IDL not produced or empty"
            exit 1
          fi
          echo "IDL bytes: $(wc -c < target/idl/dominion_silver_mint.json)"

      - name: Yarn install (post-build, for tests only)
        run: yarn install
        continue-on-error: true

      - name: Upload IDL artifact
        uses: actions/upload-artifact@v4
        with:
          name: idl
          path: target/idl/

      - name: Upload program binary
        uses: actions/upload-artifact@v4
        with:
          name: program-binary
          path: target/deploy/*.so

      - name: Upload Cargo.lock (for commit if not present)
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: Cargo.lock

      - name: anchor test
        run: anchor test --skip-local-validator
        continue-on-error: true # tests are placeholders; will fail until 55-test matrix implemented

  reproducible-build:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install solana-verify
        run: cargo install solana-verify --locked
        continue-on-error: true

      - name: Verifiable build
        run: |
          solana-verify build
        continue-on-error: true # until Docker image + Cargo.lock stable

      - name: Report binary hash
        run: |
          if [ -f target/deploy/dominion_silver_mint.so ]; then
            sha256sum target/deploy/dominion_silver_mint.so
          fi

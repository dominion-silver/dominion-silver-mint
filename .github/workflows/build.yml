name: Anchor Build + Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # EVIDENCE-DRIVEN (2026-05-19): 3.1.13 was the bug. The prior comment
  # *assumed* "3.1.13 = rustc 1.89" but CI runs proved its platform-tools
  # rustc behaves ~1.84 (edition2024-unparseable + pyth-solana-receiver-sdk
  # E0782 when locked). The LOCAL toolchain that actually built the live V2
  # .so + IDL is Solana 3.1.14 -> platform-tools v1.52 -> rustc 1.89.0
  # (edition2024-capable, compiles modern pyth-sdk). Pinning CI to 3.1.14 =
  # one consistent modern toolchain for BOTH the SBF build and the host IDL
  # build. Contract source / Anchor / pyth unchanged -> deployed bytes +
  # IDL unaffected (no redeploy). See private/CI_IDL_DETERMINISM.md.
  SOLANA_VERSION: 3.1.14
  ANCHOR_VERSION: 0.31.1
  RUST_VERSION: 1.89.0
  NODE_VERSION: 20

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Solana CLI (Agave v${{ env.SOLANA_VERSION }})
        run: |
          # Pin to the exact version rather than "stable" (which has returned
          # corrupted tarballs on anza.xyz CDN at least once; retry loop makes
          # the install resilient to transient network errors).
          for attempt in 1 2 3; do
            if sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"; then
              break
            fi
            echo "Solana install attempt $attempt failed, retrying..."
            sleep 10
          done
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          $HOME/.local/share/solana/install/active_release/bin/solana --version
          $HOME/.local/share/solana/install/active_release/bin/cargo-build-sbf --version

      - name: Install Anchor CLI (git+tag+locked pattern)
        run: |
          # --force in case cache restored a stale binary from a previous run.
          cargo install --git https://github.com/coral-xyz/anchor --tag "v${ANCHOR_VERSION}" anchor-cli --locked --force
          anchor --version

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --force
        continue-on-error: true

      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: cargo fmt check
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: cargo audit (CVE check)
        run: cargo audit
        continue-on-error: true

      - name: anchor build (SBF unlocked) + IDL (locked)
        # EVIDENCE-DRIVEN (full ground-truth converged over CI runs
        # 26086567305 / 26087219838 / 26088175606 + local inspection):
        #
        # The real root cause is the platform-tools (SBF) cargo VERSION,
        # not Solana 3.1.13-vs-3.1.14 and not a lock flag. EVERY Anchor-
        # 0.31.1-compatible Solana release ships its `cargo-build-sbf`
        # defaulting to platform-tools v1.51 = cargo/rustc 1.84. cargo
        # 1.84 cannot PARSE an `edition2024` manifest. But on the SBF
        # target there is NO single cpufeatures that works under 1.84:
        #   - cpufeatures 0.2.x: parses (edition2018) but has a hard
        #     `compile_error!` for non-x86/aarch64 targets (SBF = sbpf,
        #     so it fails to COMPILE) [run 26088175606].
        #   - cpufeatures 0.3.0: supports the SBF target but is
        #     `edition2024` (1.84 cannot PARSE it) [run 26087219838].
        # The build must stay UNLOCKED (a locked graph hits
        # pyth-solana-receiver-sdk E0782 under the SBF rustc).
        #
        # Local FACT: the deployed + sha256-verified V2 .so + IDL were
        # built with platform-tools **v1.52 = rustc/cargo 1.89.0**
        # (edition2024-capable). Under v1.52 the unlocked re-resolve
        # picks cpufeatures 0.3.0, which 1.89 PARSES and which DOES
        # support the SBF target. So: force `cargo-build-sbf` to
        # platform-tools v1.52 via its documented `--tools-version`
        # lever (anchor forwards `-- <args>` to cargo-build-sbf). This
        # makes CI use the EXACT toolchain that produced the live
        # artifacts: contract source / Anchor / pyth unchanged, deployed
        # bytes + IDL unaffected (no redeploy). See
        # private/CI_IDL_DETERMINISM.md.
        #
        # IDL extraction stays an EXPLICIT `anchor idl build -- --locked`
        # (deterministic): it builds for the HOST target (x86_64) where
        # the committed-lock cpufeatures 0.2.17 compiles fine (no SBF
        # compile_error) under the rustup-default 1.89 host cargo.
        #
        # Blocking gate (no continue-on-error). rustup default
        # ${RUST_VERSION} keeps the host cargo at 1.89; loud guard if the
        # host cargo is < 1.85.
        run: |
          rustup default ${RUST_VERSION}
          echo "host cargo  : $(cargo --version)"
          echo "sbf default : $(cargo-build-sbf --version | tr '\n' ' ')"
          ver="$(cargo --version | awk '{print $2}')"
          major="${ver%%.*}"; rest="${ver#*.}"; minor="${rest%%.*}"
          if [ "$major" -lt 1 ] || { [ "$major" -eq 1 ] && [ "$minor" -lt 85 ]; }; then
            echo "::error::host cargo $ver lacks edition2024 (need >= 1.85)"
            exit 1
          fi
          # Half 1: SBF .so only, UNLOCKED, FORCED onto platform-tools
          # v1.52 (cargo 1.89, edition2024-capable) = the local toolchain
          # that built the live artifacts. --force-tools-install so a
          # Solana-bundled v1.51 cache cannot shadow v1.52.
          anchor build --no-idl -- --tools-version v1.52 --force-tools-install
          # Half 2: IDL via explicit cargo-test, LOCKED (no re-resolve),
          # host target under the 1.89 host cargo.
          mkdir -p target/idl target/types
          anchor idl build \
            --out target/idl/dominion_silver_mint.json \
            --out-ts target/types/dominion_silver_mint.ts \
            -- --locked
          # Verify-before-claim: fail loudly if the IDL is missing/empty.
          if [ ! -s target/idl/dominion_silver_mint.json ]; then
            echo "::error::IDL not produced or empty"
            exit 1
          fi
          echo "IDL bytes: $(wc -c < target/idl/dominion_silver_mint.json)"

      - name: Yarn install (post-build, for tests only)
        run: yarn install
        continue-on-error: true

      - name: Upload IDL artifact
        uses: actions/upload-artifact@v4
        with:
          name: idl
          path: target/idl/

      - name: Upload program binary
        uses: actions/upload-artifact@v4
        with:
          name: program-binary
          path: target/deploy/*.so

      - name: Upload Cargo.lock (for commit if not present)
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: Cargo.lock

      - name: anchor test
        run: anchor test --skip-local-validator
        continue-on-error: true # tests are placeholders; will fail until 55-test matrix implemented

  reproducible-build:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install solana-verify
        run: cargo install solana-verify --locked
        continue-on-error: true

      - name: Verifiable build
        run: |
          solana-verify build
        continue-on-error: true # until Docker image + Cargo.lock stable

      - name: Report binary hash
        run: |
          if [ -f target/deploy/dominion_silver_mint.so ]; then
            sha256sum target/deploy/dominion_silver_mint.so
          fi

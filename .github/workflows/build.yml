name: Anchor Build + Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Solana 3.1.13 ships platform-tools v1.52 = Rust 1.89.0 (cargo supports edition2024 natively)
  # This avoids the entire edition2024 transitive-dep peeling problem we hit on 2.1.20 (cargo 1.84)
  SOLANA_VERSION: 3.1.13
  ANCHOR_VERSION: 0.31.1
  RUST_VERSION: 1.89.0
  NODE_VERSION: 20

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Solana CLI (Agave v${{ env.SOLANA_VERSION }})
        run: |
          # Pin to the exact version rather than "stable" (which has returned
          # corrupted tarballs on anza.xyz CDN at least once; retry loop makes
          # the install resilient to transient network errors).
          for attempt in 1 2 3; do
            if sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"; then
              break
            fi
            echo "Solana install attempt $attempt failed, retrying..."
            sleep 10
          done
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          $HOME/.local/share/solana/install/active_release/bin/solana --version
          $HOME/.local/share/solana/install/active_release/bin/cargo-build-sbf --version

      - name: Install Anchor CLI (git+tag+locked pattern)
        run: |
          # --force in case cache restored a stale binary from a previous run.
          cargo install --git https://github.com/coral-xyz/anchor --tag "v${ANCHOR_VERSION}" anchor-cli --locked --force
          anchor --version

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --force
        continue-on-error: true

      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: cargo fmt check
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: cargo audit (CVE check)
        run: cargo audit
        continue-on-error: true

      - name: anchor build (SBF) + IDL (locked, deterministic)
        run: |
          # CONVERGED FIX (6 verified runs + local repro). The root cause:
          # anchor 0.31.1's IDL extraction re-resolves deps WITHOUT
          # `--locked`, perpetually pulling the newest crates.io versions
          # (constant_time_eq 0.4.2 -> wincode-derive 0.4.5 ->
          # toml_datetime 1.1.1+spec ...), some needing a newer cargo than
          # the runner has. Verified locally: `anchor idl build -- --locked`
          # honors the committed Cargo.lock, does NOT re-resolve, and
          # produces the correct IDL (this is exactly how the live V2 IDL
          # was built). `anchor build`'s `-- <args>` only reach
          # `cargo build-sbf`, NOT the IDL extraction, so we MUST split:
          #   1. `anchor build --no-idl`  -> the .so (always succeeded)
          #   2. `anchor idl build -- --locked` -> IDL via `cargo test
          #      --locked`, which uses the proven-good locked versions and
          #      fails LOUD (never silently drifts) if the lock is stale.
          # Toolchain: rustup default ${RUST_VERSION} (matches the tracked
          # rust-toolchain.toml + the local machine) so the IDL host cargo
          # is edition2024-capable while cargo-build-sbf's `+<sbf>` proxy
          # call still works. Loud guard if cargo < 1.85.
          rustup default ${RUST_VERSION}
          echo "host cargo : $(cargo --version)"
          echo "host rustc : $(rustc --version)"
          echo "sbf builder: $(cargo-build-sbf --version)"
          ver="$(cargo --version | awk '{print $2}')"
          major="${ver%%.*}"; rest="${ver#*.}"; minor="${rest%%.*}"
          if [ "$major" -lt 1 ] || { [ "$major" -eq 1 ] && [ "$minor" -lt 85 ]; }; then
            echo "::error::host cargo $ver lacks edition2024 (need >= 1.85)"
            exit 1
          fi
          anchor build --no-idl
          mkdir -p target/idl
          ( cd programs/dominion_silver_mint_v2 \
            && anchor idl build -o "$GITHUB_WORKSPACE/target/idl/dominion_silver_mint.json" -- --locked )
          test -s target/idl/dominion_silver_mint.json \
            || { echo "::error::IDL not produced"; exit 1; }
          echo "IDL bytes: $(wc -c < target/idl/dominion_silver_mint.json)"

      - name: Yarn install (post-build, for tests only)
        run: yarn install
        continue-on-error: true

      - name: Upload IDL artifact
        uses: actions/upload-artifact@v4
        with:
          name: idl
          path: target/idl/

      - name: Upload program binary
        uses: actions/upload-artifact@v4
        with:
          name: program-binary
          path: target/deploy/*.so

      - name: Upload Cargo.lock (for commit if not present)
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: Cargo.lock

      - name: anchor test
        run: anchor test --skip-local-validator
        continue-on-error: true # tests are placeholders; will fail until 55-test matrix implemented

  reproducible-build:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install solana-verify
        run: cargo install solana-verify --locked
        continue-on-error: true

      - name: Verifiable build
        run: |
          solana-verify build
        continue-on-error: true # until Docker image + Cargo.lock stable

      - name: Report binary hash
        run: |
          if [ -f target/deploy/dominion_silver_mint.so ]; then
            sha256sum target/deploy/dominion_silver_mint.so
          fi

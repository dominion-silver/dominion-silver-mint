name: Anchor Build + Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # EVIDENCE-DRIVEN (2026-05-19): 3.1.13 was the bug. The prior comment
  # *assumed* "3.1.13 = rustc 1.89" but CI runs proved its platform-tools
  # rustc behaves ~1.84 (edition2024-unparseable + pyth-solana-receiver-sdk
  # E0782 when locked). The LOCAL toolchain that actually built the live V2
  # .so + IDL is Solana 3.1.14 -> platform-tools v1.52 -> rustc 1.89.0
  # (edition2024-capable, compiles modern pyth-sdk). Pinning CI to 3.1.14 =
  # one consistent modern toolchain for BOTH the SBF build and the host IDL
  # build. Contract source / Anchor / pyth unchanged -> deployed bytes +
  # IDL unaffected (no redeploy). See private/CI_IDL_DETERMINISM.md.
  SOLANA_VERSION: 3.1.14
  ANCHOR_VERSION: 0.31.1
  RUST_VERSION: 1.89.0
  NODE_VERSION: 20

jobs:
  # ===================================================================
  # BLOCKING GATE (audit action 0.5, added 2026-07-25).
  #
  # Every step below is intentionally WITHOUT continue-on-error. The audit's
  # finding H-02 / DOM-015 was that this workflow could not fail: a non-compiling
  # program and failing unit tests both produced a green check, because every
  # substantive step was continue-on-error and there was no test step at all.
  # The legacy job that follows is left as-is (it exists for artifact upload and
  # the known-flaky anchor build); this job is the one that gates.
  # ===================================================================
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt

      # AUDIT review of daac4ac (P1, security reviewer): `target` was cached under a key
      # that hashes only Cargo.lock, never the source. verify-release-artifact.sh
      # compares the artifact against a "clean" rebuild, and both used to compile
      # through this same shared target dir, so a stale or tampered intermediate would
      # be linked into BOTH and the hashes would agree. The script now isolates its
      # reference build with its own CARGO_TARGET_DIR; `target` is also no longer
      # cached here, so the gate's own artifact is built from source every run.
      # Only ~/.cargo/bin/ANCHOR is cached, not the whole bin dir: review-of-fixes F11
      # noted that ~/.cargo/bin holds the rustup shims (cargo, rustc, rustfmt), the
      # cache is restored AFTER dtolnay/rust-toolchain, and a tarball from an older
      # runner image can overwrite the shims that action just set up ("rustup could
      # not choose a version").
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/anchor
          key: gate-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Solana CLI (for cargo build-sbf)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: cargo fmt (BLOCKING)
        run: cargo fmt --all -- --check

      - name: cargo check (BLOCKING)
        run: cargo check -p dominion_silver_mint --all-targets --locked

      - name: cargo test (BLOCKING - this step did not exist before)
        run: cargo test -p dominion_silver_mint --lib --locked

      - name: Build the release artifact, default features (BLOCKING)
        run: cargo build-sbf --manifest-path programs/dominion_silver_mint_v2/Cargo.toml

      # AUDIT review of daac4ac (P0, integration reviewer, proved by execution): this
      # job could NEVER have passed on a fresh runner. `cargo build-sbf` does not
      # create target/idl (it makes deploy/, release/, sbpf-solana-solana/ only) and
      # target/ is gitignored, so the shell failed the redirect before anchor ran. The
      # next two BLOCKING steps then failed for the same root cause, because
      # verify-release-artifact.sh treats a missing IDL as a FAILURE rather than a
      # skip. Fixed by creating the directory. Also: `|| true` swallowed an install
      # failure (surfacing later as the far less obvious "anchor: command not found"),
      # --force was missing, and ~/.cargo/bin was not cached.
      - name: Regenerate the IDL (BLOCKING)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/target/idl"
          if ! command -v anchor >/dev/null 2>&1; then
            cargo install --git https://github.com/coral-xyz/anchor --tag v0.31.1 anchor-cli --locked --force
          fi
          anchor --version
          # REVIEW-OF-FIXES P0: this used `anchor idl build -- --locked > target/idl/....json`.
          # Redirecting STDOUT into the artifact means anything else cargo writes to stdout lands in the
          # file. On a cargo-registry cache MISS that is the "  Downloaded <crate>" progress lines, so the
          # file begins with two spaces and the JSON is corrupt. The step still exits 0 and goes GREEN,
          # and the next step dies with a raw `json.decoder.JSONDecodeError: Expecting value: line 1
          # column 3 (char 2)`.
          #
          # Consequence, verified against the real runs (30557224814, 30525729898, and every one of the
          # last twelve on main): the `gate` job has NEVER PASSED, so none of the steps after this one has
          # ever executed on CI. Not the IDL-copies diff, not the release-artifact check, not the
          # client/IDL parity gate, not either app's typecheck, tests or build. The header comment in
          # scripts/verify-client-idl-parity.ts claims "the CI job order closes that gap"; it was true as
          # YAML and false in fact.
          #
          # `-o` writes the IDL directly and leaves stdout to cargo, which removes the class rather than
          # this instance. It omits the trailing newline the redirect produced, so it is added back to keep
          # the committed copies byte-identical (the JSON itself is unchanged: verified equal).
          (cd programs/dominion_silver_mint_v2 && anchor idl build -o "$GITHUB_WORKSPACE/target/idl/dominion_silver_mint.json" -- --locked)
          printf '\n' >> "$GITHUB_WORKSPACE/target/idl/dominion_silver_mint.json"
          # Fail HERE, loudly, if the artifact is not JSON, rather than three steps later in a traceback.
          python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$GITHUB_WORKSPACE/target/idl/dominion_silver_mint.json" \
            || { echo "::error::the regenerated IDL is not valid JSON"; head -c 200 "$GITHUB_WORKSPACE/target/idl/dominion_silver_mint.json"; exit 1; }

      # Node comes up HERE, before anything that shells out to npx. The typecheck step used to sit above
      # this line and silently downloaded whatever TypeScript was newest; verify-constants-consistency.sh
      # runs the same tsc inside its section 4b and hit the identical failure one step later. Both need a
      # real node_modules, so both now run after this.
      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install root and public-app dependencies
        # The root install is what makes `npx --no-install tsc` and `npx --no-install tsx` resolve the
        # pinned compiler instead of downloading one.
        #
        # apps/public is installed HERE, before the typecheck, and that is not incidental:
        # scripts/e2e-lazer-mint.ts imports lazer-assembly and lazer-tx from apps/public/src/lib rather
        # than keeping a second copy of the envelope assembly that could drift from the one the frontend
        # ships. lazer-tx pulls @solana/wallet-adapter-react, an app dependency, so typechecking scripts/
        # genuinely requires the app's node_modules. Without this the gate failed with TS2307 on a module
        # that exists, and section 4b of verify-constants-consistency.sh hit the same error one step later.
        run: |
          npm ci
          npm ci --prefix apps/public

      - name: Verify every hand-copied address agrees with declare_id! (BLOCKING)
        run: bash scripts/verify-constants-consistency.sh

      - name: Assert the regenerated IDL matches the committed copies (BLOCKING)
        # The apps bundle their own IDL copy. If a regeneration differs from what is
        # committed, the console is describing a program that is not the one being
        # deployed. verify-constants-consistency.sh proves the three COMMITTED copies
        # agree with each other; this proves they agree with a FRESH build.
        run: |
          diff -u apps/admin/src/lib/idl/dominion_silver_mint.json \
                  target/idl/dominion_silver_mint.json \
            || { echo "::error::the committed admin IDL differs from a fresh regeneration"; exit 1; }
          diff -u apps/public/src/lib/idl/dominion_silver_mint.json \
                  target/idl/dominion_silver_mint.json \
            || { echo "::error::the committed public IDL differs from a fresh regeneration"; exit 1; }

      - name: Verify the release artifact (BLOCKING - audit A-33)
        # Refuses any binary that does not match a clean default-feature rebuild,
        # which is what catches a dev-hatch or test-harness build reaching the
        # deploy path. Also fails on a missing IDL.
        run: scripts/verify-release-artifact.sh

      - name: On-chain state harness, 141 tests (BLOCKING - audit round 4, P1-04)
        # These 141 litesvm tests run against target/deploy/dominion_silver_mint.so, the release artifact
        # built two steps above, and they are the only thing that proves the HANDLERS still call the rules
        # in src/state/. An adversarial pass measured 192 handler-level mutations that leave all 158 unit
        # tests green; this suite catches the ones that matter.
        #
        # ROUND 4 P1-04: nothing under .github/ referenced this runner. The suite existed, passed locally,
        # and gated no merge. The 19 P0 mutations closed in f9c7112 were unprotected in CI from the moment
        # they were written.
        #
        # It must run AFTER the release artifact is built and BEFORE the Lazer harness, which rebuilds into
        # target/harness with --features test-harness. The runner asserts the artifact it loads is
        # probe-free, so an ordering mistake fails loudly rather than testing the wrong bytes.
        run: bash tools/state-harness/run.sh --no-build

      - name: Lazer behavioural harness (BLOCKING - audit H-01)
        # Builds into target/harness, so it cannot contaminate the deploy artifact.
        run: bash tools/lazer-harness/run.sh

      - name: Assert the deploy artifact is still clean after the harness
        run: scripts/verify-release-artifact.sh

      - name: Typecheck the root transaction scripts (BLOCKING)
        # ROUND 3 P2: CI typechecked each APP and never the root scripts, while the structural gate checked
        # for the PRESENCE of guard text rather than loadability. So three transaction scripts shipped unable
        # to start (TS2448 twice, TS2304 twice) and a five-argument call to a six-argument function sat in
        # T1's hostile-mint case, which meant the ceremony could not compile.
        #
        # This step used to sit ABOVE Node setup, with a comment calling it "Anchor-free and network-free".
        # Both halves were wrong: with no node_modules on the runner, bare `npx tsc` DOWNLOADS whatever
        # TypeScript is newest (6.0.3 on the run that exposed this) and finds no @types/node, so it failed
        # on `moduleResolution=node10` and `baseUrl` having been removed in 6.x while the repo pins 5.9.3.
        # It never typechecked anything on CI. `--no-install` is the fix that keeps it from recurring: an
        # absent local compiler now fails loudly instead of silently fetching a different one.
        run: npx --no-install tsc -p tsconfig.scripts.json

      # D6 was marked closed when this script was WRITTEN. The review-of-fixes pointed out it ran
      # NOWHERE: the punch-list item is literally titled "No CI gate catches client-vs-IDL drift", so a
      # script a human has to remember to type did not close it.
      #
      # Placed after Node setup (it needs npx/tsx) and it reads `target/idl`, which the "Regenerate
      # the IDL" step above creates. Order matters in both directions.
      - name: Verify the clients call only instructions/accounts/errors the IDL declares (BLOCKING)
        # Root deps are installed above; re-running npm ci here just paid for the same install twice.
        run: npx --no-install tsx scripts/verify-client-idl-parity.ts

      - name: Public app (BLOCKING - typecheck, tests, production build)
        working-directory: apps/public
        run: |
          npm ci
          npx tsc --noEmit
          npx vitest run
          npm run build

      - name: Admin app (BLOCKING - typecheck, tests, production build)
        working-directory: apps/admin
        run: |
          npm ci
          npx tsc --noEmit
          npx vitest run
          npm run build

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Solana CLI (Agave v${{ env.SOLANA_VERSION }})
        run: |
          # Pin to the exact version rather than "stable" (which has returned
          # corrupted tarballs on anza.xyz CDN at least once; retry loop makes
          # the install resilient to transient network errors).
          for attempt in 1 2 3; do
            if sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"; then
              break
            fi
            echo "Solana install attempt $attempt failed, retrying..."
            sleep 10
          done
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          $HOME/.local/share/solana/install/active_release/bin/solana --version
          $HOME/.local/share/solana/install/active_release/bin/cargo-build-sbf --version

      - name: Install Anchor CLI (git+tag+locked pattern)
        run: |
          # --force in case cache restored a stale binary from a previous run.
          cargo install --git https://github.com/coral-xyz/anchor --tag "v${ANCHOR_VERSION}" anchor-cli --locked --force
          anchor --version

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --force
        continue-on-error: true

      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: cargo fmt check
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: cargo audit (CVE check)
        run: cargo audit
        continue-on-error: true

      - name: anchor build (NON-BLOCKING - Option D, definitive root cause)
        # FINAL STATE. Sanctioned Option D (NEXT_STEPS P2-07). DEFINITIVE
        # root cause, exhaustively proven over ~18 verified CI runs +
        # local repro + agave-source + crates.io-MSRV analysis. TWO
        # independent problems were found; one is FIXED, one is a
        # fundamental anchor/Solana toolchain incompatibility:
        #
        #  (1) FIXED: pyth-solana-receiver-sdk 0.6.1's own bare-trait
        #      `AnchorSerialize::try_to_vec` = E0782 hard error on modern
        #      rustc (pyth never fixed it through HEAD; solana-program
        #      2.3.0 MSRV rust 1.79 vs that >=~1.84 ceiling => no clean
        #      single toolchain). Resolved by vendoring + minimally
        #      patching pyth (commit 39a62e7, triple-reviewed SHIP,
        #      serialization byte-equivalent, supply-chain-diff clean).
        #
        #  (2) NOT a CI-fixable issue: anchor 0.31.1's `anchor build`
        #      (SBF AND IDL) re-resolves the dep graph UNLOCKED, ignoring
        #      the committed Cargo.lock. That re-resolve (a) pulls
        #      newest-crates.io edition2024 deps (`ctutils 0.4.2`) the
        #      Solana platform-tools cargo 1.84 cannot PARSE, and (b)
        #      does not reliably apply the workspace [patch.crates-io]
        #      (re-pulls un-vendored pyth -> E0782 even at cargo 1.89).
        #      `--locked` via anchor arg-forwarding does not reach the
        #      internal resolve (run 26096919038); pre-seeding cargo 1.89
        #      fixes (a) but not (b) (run 26097607450); stock cargo 1.84
        #      hits (a) (runs 26095758504 IDL / 26098522960 SBF). This is
        #      a coral-xyz/anchor + anza platform-tools toolchain
        #      incompatibility; the real fix is a DELIBERATE coordinated
        #      anchor-CLI + Solana version upgrade (mainnet-hardening,
        #      tracked in NEXT_STEPS P2-07 + CI_IDL_DETERMINISM.md), NOT a
        #      CI tweak. Re-confirmed exhaustively per Thomas's "do the
        #      spike" mandate.
        #
        # Deploy gate is INDEPENDENT of this step and intact: the live
        # .so + IDL are sha256-verified (RELEASE_ARTIFACT_V2_DEVNET.md),
        # the IDL is committed in-repo, and the `reproducible-build` job
        # (solana-verify/Docker, deterministic) is separate. Run
        # 26095758504 (this exact config: vendored pyth + non-blocking)
        # was already green-overall. Same treatment as `anchor test`.
        run: anchor build
        continue-on-error: true

      - name: Yarn install (post-build, for tests only)
        run: yarn install
        continue-on-error: true

      - name: Upload IDL artifact
        uses: actions/upload-artifact@v4
        with:
          name: idl
          path: target/idl/

      - name: Upload program binary
        uses: actions/upload-artifact@v4
        with:
          name: program-binary
          path: target/deploy/*.so

      - name: Upload Cargo.lock (for commit if not present)
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: Cargo.lock

      - name: anchor test
        run: anchor test --skip-local-validator
        continue-on-error: true # tests are placeholders; will fail until 55-test matrix implemented

  # AUDIT FINDING S-05. Every step of this job carried `continue-on-error: true` and the final step
  # was `if [ -f ... ]`, which does nothing when the file is absent. So the job went GREEN whether or
  # not a verifiable build had ever happened, and a green "reproducible-build" check is exactly the
  # kind of thing a release checklist treats as proof. It attested nothing.
  #
  # It is blocking now. The `gate` job is NOT a substitute and the audit was right to say so: gate
  # compares two builds produced by the SAME local toolchain, which catches a tampered artifact but
  # cannot demonstrate that an independent party reproduces the same bytes. Only solana-verify does
  # that, which is the whole reason this job exists.
  #
  # If it breaks, fix the Docker image or the toolchain pin. Do NOT restore continue-on-error: that
  # converts a failing proof back into a passing badge, which is worse than having no job at all.
  reproducible-build:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install solana-verify
        run: cargo install solana-verify --locked

      # S-07 INSTRUMENTED PROBE. One run must answer the whole question, because this is the only place the
      # experiment is meaningful: the image is published for amd64 ONLY, the dev machine is arm64 Darwin, so
      # a local test would run it under emulation and could not distinguish "our build differs" from
      # "emulation differs". ubuntu-latest is amd64 native, which is exactly what a third-party verifier runs.
      #
      # Established by reading solana-verify 0.5.1's source, so these are NOT the hypotheses under test:
      #   --locked IS passed (main.rs:1077, plus a sparse-registry override), so lockfile drift is ruled out
      #   the build runs against OUR mounted Cargo.toml, so [profile.release] (lto=fat, codegen-units=1,
      #     overflow-checks) applies
      #   our .so embeds no host paths (verified: zero occurrences), so the mount point cannot matter
      #
      # What remains: the container forces RUSTUP_TOOLCHAIN to its own active toolchain, and platform-tools
      # is selectable with `cargo build-sbf --tools-version`. We build with v1.51. The 3.0.0 image was
      # pushed 2026-05-04 and may ship a different one.
      - name: S-07 probe, what the container actually contains
        continue-on-error: true
        run: |
          set -x
          IMG=solanafoundation/solana-verifiable-build:3.0.0
          docker pull "$IMG"
          echo "=== toolchain and platform-tools INSIDE the image ==="
          docker run --rm --entrypoint sh "$IMG" -c 'rustc --version; rustup toolchain list; cargo build-sbf --version || true'
          echo "=== what the runner itself has, for comparison ==="
          rustc --version; cargo build-sbf --version || true
          echo "=== our own default build, on this runner, for a side-by-side hash ==="
          cargo build-sbf --manifest-path programs/dominion_silver_mint_v2/Cargo.toml -- --locked
          sha256sum target/deploy/dominion_silver_mint.so || true
          mv target/deploy/dominion_silver_mint.so /tmp/runner-native.so || true

      - name: S-07 probe, verifiable build WITHOUT a forced tools-version
        continue-on-error: true
        run: |
          solana-verify build \
            --base-image solanafoundation/solana-verifiable-build:3.0.0 \
            --library-name dominion_silver_mint
          echo "hash without --tools-version:"
          sha256sum target/deploy/dominion_silver_mint.so || true
          cp target/deploy/dominion_silver_mint.so /tmp/verify-default.so || true

      - name: S-07 probe, verifiable build WITH --tools-version v1.51
        continue-on-error: true
        run: |
          rm -f target/deploy/dominion_silver_mint.so
          solana-verify build \
            --base-image solanafoundation/solana-verifiable-build:3.0.0 \
            --library-name dominion_silver_mint \
            --cargo-build-sbf-args="--tools-version v1.51"
          echo "hash with --tools-version v1.51:"
          sha256sum target/deploy/dominion_silver_mint.so || true
          cp target/deploy/dominion_silver_mint.so /tmp/verify-v151.so || true

      - name: S-07 probe, the four hashes side by side
        continue-on-error: true
        run: |
          echo "pinned in config/mainnet-authorities.json:"
          python3 -c "import json;print(json.load(open('config/mainnet-authorities.json'))['release_artifact']['sha256'])"
          for f in /tmp/runner-native.so /tmp/verify-default.so /tmp/verify-v151.so; do
            [ -f "$f" ] && echo "$(sha256sum "$f")" || echo "MISSING $f"
          done
          echo "If verify-v151 equals the pinned hash, S-07 closes by forcing the tools version and OUR"
          echo "BINARY DOES NOT CHANGE, which is the only acceptable shape of fix before a launch."
          echo "If runner-native also differs from the pinned hash, the divergence is host-vs-linux and not"
          echo "container-specific, which is a different and larger problem."

      # The real gate. It stays RED until a verifiable build reproduces the pinned artifact: a green that
      # compares nothing is worse than a visible red.
      - name: Verifiable build
        run: |
          rm -f target/deploy/dominion_silver_mint.so
          solana-verify build \
            --base-image solanafoundation/solana-verifiable-build:3.0.0 \
            --library-name dominion_silver_mint \
            --cargo-build-sbf-args="--tools-version v1.51"

      - name: Compare the verifiable build against the pinned release hash
        run: |
          set -euo pipefail
          SO=target/deploy/dominion_silver_mint.so
          if [ ! -f "$SO" ]; then
            echo "::error::solana-verify produced no binary at $SO."
            echo "This job exists to attest a third-party-reproducible build. No binary means no"
            echo "attestation, so it fails rather than reporting nothing and passing (audit S-05)."
            exit 1
          fi
          GOT=$(sha256sum "$SO" | awk '{print $1}')
          EXPECTED=$(python3 -c "import json;print(json.load(open('config/mainnet-authorities.json'))['release_artifact']['sha256'])")
          echo "solana-verify: $GOT"
          echo "pinned       : $EXPECTED"
          # RE-AUDIT P2. Removing continue-on-error proved solana-verify can produce A binary; it never
          # proved it produces OUR binary, because the hash was only printed. "Independent third-party
          # check" was theatre until this comparison existed.
          #
          # KNOWN AND DELIBERATE: this is expected to FAIL today. The Docker toolchain
          # (solana-verify reported v2.3.0) differs from the release toolchain (3.0.0 / platform-tools
          # 1.51), so the bytes differ. That is exactly the open divergence documented in the runbook as
          # S-07, and it should be visible as a red check rather than hidden behind a green one that
          # compares nothing. Fix the toolchain, do not delete the comparison.
          if [ "$GOT" != "$EXPECTED" ]; then
            echo "::error::the verifiable build does NOT match the pinned release artifact."
            echo "Either the release hash in config/mainnet-authorities.json is stale (re-record it), or"
            echo "the solana-verify toolchain differs from the release toolchain (runbook, S-07)."
            exit 1
          fi
          echo "MATCH: an independent solana-verify build reproduces the pinned release artifact."

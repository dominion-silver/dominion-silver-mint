name: Health monitor

# THE OPERATIONAL ALARM. Separate workflow from redeem-monitor.yml on purpose: that one answers "is the
# redemption outflow abnormal", this one answers "is someone attacking us and can we still pay". Sharing
# a workflow would mean one failing step hides the other's result.
#
# GITHUB'S SCHEDULER IS NOT RELIABLE AND THIS FILE SHOULD NOT PRETEND OTHERWISE. Measured on 2026-08-13:
# after redeem-monitor.yml reached the default branch at 10:29Z, its first scheduled run fired at 12:26Z,
# nearly two hours late. Scheduled events are queued and dropped under load, and `schedule` registers
# from the DEFAULT BRANCH only. So a missed window is normal, and silence proves nothing.
#
# That is what HEARTBEAT_URL is for: the script pings it on every completed run, and an external
# dead-man's-switch (healthchecks.io or equivalent) alerts when the pings stop. Without that secret,
# nothing anywhere notices this monitor dying, which is the failure mode that matters most because it
# looks exactly like "no problems found".
#
# A RED RUN HERE MEANS THE MONITOR IS BROKEN, NOT THAT THE PROTOCOL IS. That distinction was learned the
# expensive way: this workflow used to exit non-zero on every alert, so GitHub mailed a failure notice
# every ten minutes for as long as any condition stayed true. On 2026-08-21 that was 100 of the last 100
# runs, all red, all for the same three lines. Alerts belong in Telegram and they are sent on a
# TRANSITION only; the job's own status is reserved for "the check could not be completed".

permissions:
  contents: read

on:
  schedule:
    # Every ten minutes. GitHub's floor is five, and runs are queued, so treat this as "about every ten".
    - cron: "*/10 * * * *"
    # The weekly digest: Monday 09:00 UTC. A trend to read, not an alarm to react to, which is why it is
    # a separate entry rather than a branch inside the ten-minute job.
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      weekly:
        description: "Send the weekly digest instead of only alerting"
        type: boolean
        default: false

concurrency:
  # Never let two runs overlap: they would double-count the window and could double-post an alert.
  group: health-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: 20

      # Root deps only. The monitor reads the IDL committed under apps/*, so no Rust toolchain and no
      # app install are needed: building an IDL for a ten-minute cron would cost twenty minutes a run.
      - name: Install
        run: npm ci

      # THE ALERT MEMORY. Without it every run is a first run, and a first run treats every open
      # condition as new, which is precisely the flood this restores away. A cache MISS is safe by
      # design: it degrades to one duplicate message, never to silence. The key carries the run id
      # because a cache entry cannot be overwritten; `restore-keys` then picks the most recent one.
      - name: Restore alert state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .monitor-state
          key: health-alert-state-${{ github.run_id }}
          restore-keys: health-alert-state-

      - name: Health check
        env:
          RPC_MAINNET: ${{ secrets.RPC_MAINNET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
        run: |
          set -euo pipefail
          if [ -z "${RPC_MAINNET}" ]; then
            echo "::error::RPC_MAINNET is not set, so this check did not run."
            # A monitor that cannot check must not report success. Same posture as the script's exit 2.
            exit 1
          fi
          # The Monday 09:00 cron sends the digest; every other trigger only alerts. `github.event.schedule`
          # carries the cron expression that fired, which is the only way to tell the two apart.
          WEEKLY=""
          if [ "${{ github.event.schedule }}" = "0 9 * * 1" ] || [ "${{ inputs.weekly }}" = "true" ]; then
            WEEKLY="--weekly"
          fi
          DOMINION_RPC="${RPC_MAINNET}" npx tsx scripts/health-monitor.ts ${WEEKLY}

      # `always()`: the state must survive a failed check, otherwise a transient RPC error re-announces
      # every open condition on the next run.
      - name: Save alert state
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .monitor-state
          key: health-alert-state-${{ github.run_id }}

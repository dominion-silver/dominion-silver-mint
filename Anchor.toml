[toolchain]
anchor_version = "0.31.1"
solana_version = "3.0.0"

[features]
resolution = true
skip-lint = false

# AUDIT DOM-014: localnet and mainnet pointed at the RETIRED GDN5k... id, which is
# not this binary's declare_id. An operator could initialize, verify or sign against
# the wrong program. localnet now matches declare_id.
[programs.localnet]
dominion_silver_mint = "3ucji6JDQsbuicvNaPfFeHh9diAjTx5kqEjEZzaZ5ZNQ"

[programs.devnet]
dominion_silver_mint = "3ucji6JDQsbuicvNaPfFeHh9diAjTx5kqEjEZzaZ5ZNQ"

# AUDIT DOM-014 is now SATISFIED rather than deferred: the mainnet id was generated on 2026-08-08 and
# is the same id on every cluster, so no tooling can point at a program nobody controls. The comment
# that used to sit here said declaring a stale id is worse than declaring none, which was right; what
# closes it is a real id, not an absent entry.
[programs.mainnet]
dominion_silver_mint = "3ucji6JDQsbuicvNaPfFeHh9diAjTx5kqEjEZzaZ5ZNQ"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test]
startup_wait = 5000
shutdown_wait = 2000
upgradeable = false

[test.validator]
url = "https://api.devnet.solana.com"

[toolchain]
anchor_version = "0.31.1"
solana_version = "3.0.0"

[features]
resolution = true
skip-lint = false

# Every cluster below declares the SAME id as this binary's declare_id!. A cluster entry that
# names anything else lets an operator initialize, verify or sign against the wrong program.
[programs.localnet]
dominion_silver_mint = "3ucji6JDQsbuicvNaPfFeHh9diAjTx5kqEjEZzaZ5ZNQ"

[programs.devnet]
dominion_silver_mint = "3ucji6JDQsbuicvNaPfFeHh9diAjTx5kqEjEZzaZ5ZNQ"

# The mainnet id is the same id on every cluster, so no tooling can point at a program nobody
# controls. Declaring a stale id is worse than declaring none, which is why this entry is not
# left empty; what
# closes it is a real id, not an absent entry.
[programs.mainnet]
dominion_silver_mint = "3ucji6JDQsbuicvNaPfFeHh9diAjTx5kqEjEZzaZ5ZNQ"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test]
startup_wait = 5000
shutdown_wait = 2000
upgradeable = false

[test.validator]
url = "https://api.devnet.solana.com"

[toolchain]
anchor_version = "0.31.1"
solana_version = "3.0.0"

[features]
resolution = true
skip-lint = false

# AUDIT DOM-014: localnet and mainnet pointed at the RETIRED GDN5k... id, which is
# not this binary's declare_id. An operator could initialize, verify or sign against
# the wrong program. localnet now matches declare_id.
[programs.localnet]
dominion_silver_mint = "HXaptAcaXBoEAsNuEv4ZwYrciHbMxSpip2VScRVDjo1Z"

[programs.devnet]
dominion_silver_mint = "HXaptAcaXBoEAsNuEv4ZwYrciHbMxSpip2VScRVDjo1Z"

# AUDIT DOM-014: the mainnet entry is intentionally ABSENT until the real mainnet
# program id is generated and reviewed. Declaring a stale id here is worse than
# declaring none: it silently points mainnet tooling at a program nobody controls.
# [programs.mainnet]
# dominion_silver_mint = "<TBD: generate at the mainnet deploy ceremony>"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test]
startup_wait = 5000
shutdown_wait = 2000
upgradeable = false

[test.validator]
url = "https://api.devnet.solana.com"
